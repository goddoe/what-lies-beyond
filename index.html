<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>What Lies Beyond</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Noto+Sans+JP:wght@300;400;700&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">
    <div id="lang-select">
      <button data-lang="ko">한국어</button>
      <button data-lang="en">English</button>
      <button data-lang="ja">日本語</button>
      <button data-lang="zh">中文</button>
      <button data-lang="fr">Français</button>
    </div>
    <div id="game-wrapper">
      <canvas id="game-canvas" width="384" height="216"></canvas>
    </div>

    <div id="dialogue-overlay" class="hidden">
      <div id="dialogue-speaker"></div>
      <div id="dialogue-text"></div>
      <div id="dialogue-prompt">▼</div>
    </div>

    <div id="ending-layer" class="hidden">
      <div id="perspective-container">
        <div id="phone-hand-unit">
          <div id="phone-frame">
            <div id="phone-screen">
              <div id="chat-ui">
                <div id="chat-header">
                  <span class="chat-avatar">●</span>
                  <span class="chat-name">AVOLC</span>
                </div>
                <div id="chat-messages"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="ending-text" class="hidden"></div>
    </div>

    <div id="title-card" class="hidden">
      <div id="title-main"></div>
      <div id="title-sub"></div>
      <div id="restart-btn" class="hidden"></div>
      <a id="credit" class="hidden" href="https://goddoe.github.io/about" target="_blank" rel="noopener">Sungju Kim</a>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
