<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>밖에는 무엇이 있나</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">
    <div id="game-wrapper">
      <canvas id="game-canvas" width="384" height="216"></canvas>
    </div>

    <div id="dialogue-overlay" class="hidden">
      <div id="dialogue-speaker"></div>
      <div id="dialogue-text"></div>
      <div id="dialogue-prompt" class="hidden">▼</div>
    </div>

    <div id="ending-layer" class="hidden">
      <div id="perspective-container">
        <div id="phone-hand-unit">
          <div id="hand-silhouette">
            <svg viewBox="0 0 260 520" xmlns="http://www.w3.org/2000/svg">
              <!-- Left fingers wrapping over phone edge -->
              <path d="M2,200 Q0,180 4,160 Q8,140 10,130 L14,135 Q10,150 8,170 L8,200 Z" fill="rgba(55,45,40,0.85)"/>
              <path d="M8,185 Q6,160 10,140 Q14,120 16,110 L20,115 Q16,130 14,150 L14,185 Z" fill="rgba(58,48,42,0.85)"/>
              <path d="M14,180 Q12,155 16,132 Q20,112 22,102 L26,108 Q22,125 20,148 L20,180 Z" fill="rgba(55,45,40,0.85)"/>
              <path d="M20,185 Q18,162 22,142 Q26,125 28,118 L32,124 Q28,138 26,158 L26,185 Z" fill="rgba(52,42,38,0.85)"/>
              <!-- Palm behind phone -->
              <path d="M2,200 L2,380 Q4,400 20,410 L40,410 Q50,405 50,390 L50,200
                       Q48,195 26,185 L20,185 Q8,192 2,200 Z" fill="rgba(50,42,38,0.9)"/>
              <!-- Thumb wrapping on right side -->
              <path d="M230,250 Q240,240 245,225 Q248,210 244,200 L238,205 Q240,215 238,228 L232,248 Z" fill="rgba(55,45,40,0.85)"/>
              <path d="M230,250 Q235,260 238,280 L240,310 Q240,330 235,340 L230,335 Q232,320 232,300 L228,260 Z" fill="rgba(50,42,38,0.85)"/>
            </svg>
          </div>
          <div id="phone-frame">
            <div id="phone-screen">
              <div id="chat-ui">
                <div id="chat-header">
                  <span class="chat-avatar">●</span>
                  <span class="chat-name">Claude</span>
                </div>
                <div id="chat-messages"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="ending-text" class="hidden"></div>
    </div>

    <div id="title-card" class="hidden">
      <div id="title-main">밖에는 무엇이 있나</div>
      <div id="title-sub">What Lies Beyond</div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
